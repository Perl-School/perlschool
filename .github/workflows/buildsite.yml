name: Generate web page

on:
  push:
    branches: 'master'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      PERLSCHOOL_DB: ${{ vars.PERLSCHOOL_DB }}
      PERLSCHOOL_ERRATA_FORM_URL: ${{ vars.PERLSCHOOL_ERRATA_FORM_URL }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install cpanm and Expat headers
      run: |
          sudo apt-get -o Acquire::Retries=5 update -y
          sudo apt-get -o Acquire::Retries=5 install -y cpanminus libexpat1-dev

    - name: Install modules
      run: |
          sudo cpanm --installdeps --notest .

    - name: Test site generation
      run: PERL5LIB=lib prove -v t

    - name: Create pages
      run: |
        mkdir -p docs
        PERL5LIB=lib bin/build

    - name: Update pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: docs/

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

